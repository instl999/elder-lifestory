[project]
name = "lifestory"
version = "0.1.0"
description = "Phase 0 operator workbench for the LifeStory memoir service"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1",
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
    "openai>=1.40",
    "pydantic>=2.7",
    "pypinyin>=0.50",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lifestory = "lifestory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lifestory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
